annotation_mapping:
  reference_chromosomes:
    - chr1
    - chr2
    - chr3
    - chr4
    - chr5
    - chr6
    - chr7
    - chr8
    - chr9
    - chr10
    - chr11
    - chr12
    - chr13
    - chr14
    - chr15
    - chr16
    - chr17
    - chr18
    - chr19
    - chrX
    - chrY
    - chrM
  precedence:
    - Use a symbol when it maps to exactly one gene on a declared reference chromosome.
    - When no reference-chromosome record exists, use exactly one non-reference record.
    - Mark all remaining multiple mappings ambiguous and exclude them from exported gene sets.
  accepted_export_biotype: protein_coding

state_gene_policy:
  go_annotation_table: go_all
  include_all_evidence_codes: true
  go_sets:
    cell_cycle:
      ontology: bp
      roots:
        - id: GO:0007049
          name: cell cycle
    interferon_response:
      ontology: bp
      roots:
        - id: GO:0034340
          name: response to type I interferon
        - id: GO:0034341
          name: response to type II interferon
    heat_shock:
      ontology: bp
      roots:
        - id: GO:0034605
          name: cellular response to heat
    generic_stress:
      ontology: bp
      roots:
        - id: GO:0006986
          name: response to unfolded protein
        - id: GO:0034599
          name: cellular response to oxidative stress
  curated_sets:
    immediate_early:
      source: Denisenko et al. 2020, Genome Biology 21:130
      doi: 10.1186/s13059-020-02048-6
      derivation: Canonical immediate-early subset of the authors' 17-gene warm-dissociation stress score.
      symbols: [Atf3, Btg1, Btg2, Dusp1, Egr1, Fos, Fosb, Ier2, Ier3, Jun, Junb, Jund]
    generic_stress_dissociation:
      source: Denisenko et al. 2020, Genome Biology 21:130
      doi: 10.1186/s13059-020-02048-6
      derivation: Exact 17-gene warm-dissociation stress score reported in Methods.
      symbols: [Atf3, Btg1, Btg2, Dusp1, Egr1, Fos, Fosb, Hsp90ab1, Hspa1a, Hspa1b, Hspa8, Hspb1, Ier2, Ier3, Jun, Junb, Jund]
  action: Flag all members in complete statistics and exclude them from accepted core identity sets; retain them only in separately named auxiliary state sets.

mandatory_identity_exclusions:
  symbol_or_chromosome:
    - chromosome_Y_genes
    - Xist
    - mitochondrial_genes
  go_sets:
    ribosomal_protein_genes:
      ontology: mf
      roots:
        - id: GO:0003735
          name: structural constituent of ribosome
    hemoglobin_genes:
      ontology: cc
      roots:
        - id: GO:0005833
          name: hemoglobin complex
  gencode_biotypes:
    - IG_V_gene
    - IG_D_gene
    - IG_J_gene
    - TR_V_gene
    - TR_D_gene
    - TR_J_gene

