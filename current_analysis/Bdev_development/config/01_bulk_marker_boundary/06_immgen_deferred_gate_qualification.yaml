qualification_scope:
  included:
    - 200 deterministic balanced one-library-per-population resamples
    - TMM recalculation and required-effect recalculation in every resample
    - leave-one-target-population-out robust quasi-likelihood refits
    - leave-one-target-library-out local-stage robust quasi-likelihood refits
    - population-by-laboratory and population-by-organ contingency audits
    - complete laboratory and organ separation flags for every contrast
    - synthetic unrelated-lineage tissue-bias and independent-support controls
    - broad-lineage leave-one-population-out score validation
    - broad-validation-only population scoring
    - local-neighbor pairwise AUROC validation
  explicitly_deferred:
    - full ImmGen marker execution
  acceptance_rule: This step may qualify deferred gate mechanics but cannot emit accepted_core gene sets or an importable GMT.

balanced_resampling:
  iterations: 200
  seed: 20261031
  schedule: Cycle deterministically through a seeded permutation of each population's libraries; selections per library may differ by at most one.

synthetic_confounding_controls:
  unrelated_tissue_bias:
    rejection_effect_threshold: 0.75
    cases:
      - control_id: tissue_bias_reproduced
        source_effect: 1.10
        unrelated_lineage_effect: 0.90
        expected_outcome: rejected_tissue_bias
      - control_id: identity_not_tissue_bias
        source_effect: 1.10
        unrelated_lineage_effect: 0.10
        expected_outcome: retained_no_reproduced_bias
  unresolved_confounding:
    cases:
      - control_id: separated_without_support
        completely_separated: true
        independent_support: false
        expected_outcome: candidate_confounding
      - control_id: separated_with_support
        completely_separated: true
        independent_support: true
        expected_outcome: passes_confounding_gate
      - control_id: not_separated
        completely_separated: false
        independent_support: false
        expected_outcome: passes_confounding_gate

