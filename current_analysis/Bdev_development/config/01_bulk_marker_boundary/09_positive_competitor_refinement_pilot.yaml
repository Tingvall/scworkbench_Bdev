purpose:
  - Test whether a positive-only, multigene strongest-competitor refinement analogous to the archived Parse cytokine workflow improves target separation.
  - Keep effect direction, expression, annotation, and support gates while using FDR as ranking evidence rather than a hard candidate-pool gate.
  - Produce diagnostic candidates only; do not revise the approved marker contract or create a scWorkbench import artifact.

