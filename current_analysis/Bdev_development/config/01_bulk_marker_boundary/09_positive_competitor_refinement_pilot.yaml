method:
  direction: positive_only
  candidate_pool_maximum_genes: 100
  candidate_eligibility:
    expression_filter: all required contrasts
    annotation_identity: core_identity_eligible
    target_support: retain approved family threshold
    effect: retain every approved family global and competitor or neighbor effect threshold
    fdr: ranking_evidence_not_hard_pool_gate
  ranking:
    - descending fraction of required tests passing their approved FDR threshold
    - ascending worst required-test FDR divided by its approved threshold
    - descending target support
    - descending worst effect margin over its approved threshold
    - descending worst target-versus-competitor AUROC
    - ascending gene symbol
  score:
    type: mean_within_profile_expression_percentile_rank
    population_families: sum discovery-library counts within population before ranking
    local_family: rank each discovery RNA library
  refinement:
    objective: standardized gap between target median score and strongest declared competitor median score
    operation: greedy one-gene deletion
    floor: approved family minimum gene count
    stop: no single deletion strictly improves the objective or the floor is reached
  diagnostic_support_fraction: 0.80
  limitations:
    - Candidate ranking and greedy refinement use the complete discovery data and are therefore optimistic.
    - Fixed-set target-unit support does not make gene selection cross-fitted.
    - Sparse ImmGen target replication prevents faithful three-fold Parse-style construction for many B targets.

