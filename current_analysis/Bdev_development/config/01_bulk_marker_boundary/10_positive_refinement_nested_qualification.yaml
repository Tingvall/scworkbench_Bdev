qualification:
  direction: positive_only
  unit:
    superlineage: discovery_population
    broad_lineage: discovery_population
    b_branch: discovery_population
    b_local_stage: discovery_rna_library
  minimum_independent_target_units: 3
  folds: leave_one_target_unit_out
  candidate_pool_maximum_genes: 100
  candidate_rules:
    - Refit edgeR on training units only.
    - Retain approved expression-filter, core-identity, target-support, and every positive effect threshold.
    - Use fold-specific FDR as ranking evidence rather than a hard eligibility gate.
    - Do not use negative genes, down modules, or Bdev data.
  ranking:
    - descending fraction of required tests passing their approved FDR threshold
    - ascending worst required-test FDR divided by its approved threshold
    - descending target support
    - descending worst positive-effect margin over its threshold
    - ascending gene symbol
  refinement:
    score: mean_within_profile_expression_percentile_rank
    objective: standardized target-training-median minus strongest-competitor-training-median
    operation: greedy one-gene deletion on training profiles only
    floor: approved family minimum gene count
  heldout_pass: held-out target-unit score is strictly greater than every training competitor-group median
  minimum_nested_pass_fraction: 0.80
  stable_membership_frequency: 0.80
  method_screen_pass:
    - every fold constructs at least the family minimum genes
    - nested held-out pass fraction is at least 0.80
    - at least the family minimum genes occur in at least 80 percent of fold-final memberships
  acceptance_policy: Method-screen evidence only; no target or gene set is accepted by this qualification.

