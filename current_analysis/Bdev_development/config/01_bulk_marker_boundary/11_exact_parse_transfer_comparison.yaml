method:
  direction: positive_only
  crossfit_folds: 3
  fold_assignment: deterministic_round_robin_over_ordered_target_units
  minimum_independent_target_units: 3
  specificity_contrast: target_minus_equal_weight_mean_of_all_other_family_groups
  minimum_oriented_log2_fold_change: 0.5
  strict_fdr: 0.05
  fold_top_genes: 100
  candidate_rule: intersection_of_all_three_fold_top100_lists
  minimum_candidate_genes: 20
  scoring:
    type: ucell_capped_rank_on_raw_immgen_library_counts
    max_rank: 1500
    population_score: mean_library_score_within_population
    group_score: median_independent_unit_score
  refinement:
    objective: standardized_target_minus_strongest_competitor_group_median
    operation: greedy_one_gene_deletion
    floor: 20
    stop: no_single_deletion_strictly_improves_objective_or_floor_reached
  final_mean_test: target_group_median_strictly_greater_than_every_other_family_group_median
  unavailable_parse_route: responder_fraction_requires_matched_control_cells_and_has_no_immgen_bulk_analogue
  limitations:
    - Three folds are deterministic partitions of target units because ImmGen populations are not matched three-replicate blocks across all groups.
    - Greedy refinement and the final mean test use the complete discovery profiles and are optimistic, as in the archived Parse review method.
    - The responder route is not run because ImmGen has no matched control-cell distribution.
    - No single-cell expression value, label, embedding, or pseudotime enters construction or comparison.

