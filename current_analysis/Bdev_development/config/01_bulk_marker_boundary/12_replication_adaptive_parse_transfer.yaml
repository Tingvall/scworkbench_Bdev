purpose:
  - Extend the Parse transfer to every approved ImmGen target using evidence tiers determined only by available independent ImmGen units.
  - Preserve the completed three-fold exact-transfer memberships for targets with at least three units.
  - Use two-fold leave-one-unit-out intersections for two-unit targets and full-data-only provisional construction for singleton targets.
  - Compare the adaptive collection with all previously completed ImmGen methods under the frozen capped-rank score.

