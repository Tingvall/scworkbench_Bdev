method:
  direction: positive_only
  specificity_contrast: target_minus_equal_weight_mean_of_all_other_family_groups
  minimum_oriented_log2_fold_change: 0.5
  strict_fdr: 0.05
  fold_top_genes: 100
  minimum_candidate_genes: 20
  evidence_tiers:
    high_threefold:
      minimum_units: 3
      construction: reuse_completed_exact_transfer
    moderate_twofold:
      units: 2
      construction: intersection_of_two_leave_one_target_unit_out_top100_lists
    provisional_singleton:
      units: 1
      construction: full_data_top100_without_replication_stability_claim
  scoring:
    type: ucell_capped_rank_on_raw_immgen_library_counts
    max_rank: 1500
    population_score: mean_library_score_within_population
    group_score: median_independent_unit_score
  refinement:
    objective: standardized_target_minus_strongest_competitor_group_median
    operation: greedy_one_gene_deletion_on_complete_discovery_profiles
    floor: 20
    stop: no_single_deletion_strictly_improves_objective_or_floor_reached
  final_mean_test: target_group_median_strictly_greater_than_every_other_family_group_median
  limitations:
    - Two-fold sets have only one target unit in each training fit and therefore provide weaker biological-replication evidence than three-fold sets.
    - Singleton sets provide no target-unit reproducibility evidence and remain provisional regardless of full-data discrimination.
    - Full-data refinement and mean testing are optimistic.
    - No single-cell expression value, label, embedding, or pseudotime enters construction or comparison.

