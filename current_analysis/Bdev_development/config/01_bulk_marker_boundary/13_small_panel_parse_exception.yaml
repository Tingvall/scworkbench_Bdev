policy:
  standard_minimum_genes: 20
  small_panel_minimum_genes: 5
  eligible_evidence_tier: moderate_twofold
  eligibility:
    - candidate is the complete intersection of two leave-one-target-unit-out top-100 rankings
    - candidate contains at least 5 and fewer than 20 genes
    - target failed the adaptive run only because it was below the standard 20-gene minimum
  membership_rule: retain_complete_stable_intersection_without_greedy_deletion
  evidence_label: moderate_twofold_small_panel
  acceptance_effect: none_diagnostic_only
  rationale:
    - User explicitly authorized a lower gene count while retaining awareness of its limitation.
    - Five genes is the prespecified minimum used by the earlier archived Parse discovery workflow.
    - Retaining the complete intersection avoids optimizing an already small panel on the same discovery profiles.

