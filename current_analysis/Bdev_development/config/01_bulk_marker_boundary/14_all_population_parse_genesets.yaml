execution_boundary: outside_scworkbench

purpose:
  - Construct a population-specific positive marker geneset for every ImmGen population in the frozen vM25 matrix.
  - Preserve the original held-out validation boundary when constructing discovery-population sets.
  - Label replication evidence and fallback construction explicitly; emit diagnostic candidates only.

