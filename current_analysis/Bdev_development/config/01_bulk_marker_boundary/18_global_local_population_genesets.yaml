target_scope:
  expected_populations: 64
  expected_discovery_populations: 61
  expected_held_out_validation_populations: 3
  discovery_role: discovery
  held_out_role: held_out_validation
  held_out_rule: Add only the held-out target to the frozen discovery atlas; never add other held-out populations.

method:
  direction: positive_only
  cross_lineage_contrast: target_mean_log2_cpm_minus_equal_weight_mean_of_other_broad_lineages_with_equal_population_weight_within_lineage
  within_lineage_contrast: reuse_the_pinned_target_library_crossfit_edgeR_rankings_from_step_14
  joint_gene_rule: gene_must_pass_minimum_positive_effect_in_both_contrasts
  minimum_cross_lineage_log2_cpm_difference: 0.5
  minimum_within_lineage_log2_fold_change: 0.5
  strict_fdr: 0.05
  fold_top_genes: 100
  standard_minimum_genes: 20
  small_panel_minimum_genes: 5
  crossfit_folds_for_three_or_more_units: 3
  evidence_tiers:
    replicated_threefold: intersection_of_three_target_library_holdout_rankings
    moderate_twofold: intersection_of_two_target_library_holdout_rankings
    provisional_singleton: full_data_ranking_without_replication_claim
  empty_intersection_fallback:
    maximum_genes: 100
    status: score_only_ranked_union_fallback
  ranking:
    order:
      - within_lineage_strict_significance
      - minimum_of_cross_lineage_log2_cpm_difference_and_within_lineage_log2_fold_change
      - within_lineage_F_statistic
      - within_lineage_FDR
      - gene_symbol
  scoring:
    type: ucell_capped_rank_on_raw_immgen_library_counts
    max_rank: 1500
  refinement:
    objective: standardized_target_minus_strongest_population_among_all_other_populations
    operation: greedy_one_gene_deletion_on_complete_immgen_evaluation_profiles
    standard_floor: 20
    small_panel_rule: preserve_complete_nonempty_crossfold_intersection
  limitations:
    - Cross-lineage screening is a deterministic population-balanced log2-CPM effect screen, not a second edgeR significance claim.
    - Full-data refinement and the complete-atlas confusion matrix are optimistic.
    - Target-membership holdout validation replaces only the target program with its fold-specific training membership; competitor memberships remain complete-data candidates.
    - Singleton populations cannot qualify for discrete labels.
    - No Bdev expression, label, embedding, or pseudotime enters discovery or qualification.

flat_default_qualification:
  calibration: per_program_percentile_across_immgen_libraries
  minimum_calibrated_score: 0.8
  minimum_calibrated_margin: 0.1
  ties: unassigned
  minimum_target_membership_holdout_assigned_correct_fraction: 0.67
  label_eligible_requirements:
    - at least two independent target libraries
    - at least five final genes
    - target population ranks first on complete ImmGen population means
    - target-membership holdout assigned-correct fraction is at least 0.67
  output_policy:
    score_collection: all_nonempty_64_programs
    label_collection: only_programs_passing_every_label_eligible_requirement
    acceptance_effect: none_diagnostic_only

runtime:
  python_packages: [numpy, pandas, pyyaml]
  reused_local_model_runtime: edgeR_4.6.3_R_4.5.2

