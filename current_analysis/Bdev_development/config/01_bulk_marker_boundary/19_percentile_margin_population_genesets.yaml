method:
  candidate_membership:
    multiple_folds: intersection
    singleton: full_data_joint_top100
    empty_intersection: ranked_union_by_fold_presence_then_mean_rank
  scoring:
    type: ucell_capped_rank_on_raw_immgen_library_counts
    max_rank: 1500
  calibration:
    method: percentile
    ties_method: average
  refinement:
    objective: mean_target_library_target_program_percentile_minus_strongest_competing_program_percentile
    operation: greedy_one_gene_deletion
    complete_program_schedule: repeated_coordinate_passes_in_population_order
    standard_floor: 20
    small_panel_rule: preserve_complete_candidate_below_floor
    improvement: strict
  evaluation_atlas:
    discovery_targets: all_discovery_libraries
    held_out_derived_targets: frozen_discovery_atlas_plus_target_only
  limitations:
    - Complete-data memberships and margins are optimistic.
    - Fold-specific refinement can overfit the remaining one or more target training libraries; target-library holdout results remain the qualification evidence.
    - Competitor memberships in a target holdout are complete-data refined programs.
    - No Bdev data enter refinement or qualification.

flat_default_qualification:
  minimum_calibrated_score: 0.8
  minimum_calibrated_margin: 0.1
  tie_tolerance: 1.0e-8
  minimum_target_membership_holdout_assigned_correct_fraction: 0.67
  minimum_genes: 5
  require_two_target_libraries: true
  require_complete_population_mean_rank_one: true
  acceptance_effect: none_diagnostic_only

