schema_version: bdev.slingshot_semantics_gap_analysis.v1
status: gap_analysis_complete_no_source_change
capability_id: 02_slingshot_trajectory_semantics
audited_on: 2026-11-02

scope:
  purpose: Determine whether the qualified scwbTrajectory interface can reproduce the published Bdev Slingshot fit and support the preserved scalar pt field as an explicit fallback trajectory source.
  source_changes_authorized: false
  paper_analysis_authorized: false

runtime_evidence:
  baseline_sif:
    path: /mnt/sata2/jtg_storage/msi_projects/scworkbench_Bdev/current_analysis/inputs/containers/scworkbench-generic-collaborator-amd64-20261029.sif
    sha256: 2c9aa71f69d5775166f7dd0625176a8795d00caa498500eae7c39c42c2a7695a
  scwbTrajectory:
    version: 0.1.2
    source_commit: de6e0810578e918cf9425858eddd0549e41195be
    checkout: /mnt/sata2/jtg_storage/msi_projects/scworkbench_Bdev/current_analysis/Bdev_development/source_repositories/scwbTrajectory
  slingshot:
    version: 2.16.0
    inspected_method: getLineages_matrix_matrix
    method_accepts:
      - omega
      - omega_scale

published_recipe:
  source: https://github.com/Tingvall/Bdev_epigenetics/blob/main/script/scMulti/scMulti_analysis.Rmd
  fit_space: umap.atac
  cluster_field: peaks_snn_res.1.2
  exclude_clusters:
    - "9"
    - "15"
    - "18"
    - "19"
    - "22"
    - "23"
  start_cluster: "5"
  stretch: 0
  omega: true
  omega_scale: 5
  selected_lineage: L4
  published_scalar_transform: negate
  full_axis_alignment: match_filtered_barcodes_back_to_all_cells
  missingness: excluded_or_non_lineage_cells_remain_missing
  pin_exact_source_commit_before_qualification: true

interface_audit:
  supported:
    fit_space: true
    categorical_cluster_vector: true
    exclude_clusters: true
    start_cluster: true
    stretch_zero: true
    fitted_model_output: true
    lineage_specific_pseudotime_family: true
    downstream_lineage_key_selection: true
  missing:
    omega_parameter: true
    omega_scale_parameter: true
    preserved_scalar_cell_vector_to_one_lineage_family: true
  semantic_mismatch:
    legacy_negation: minus_lineage_4
    existing_downstream_invert: max_pseudotime_minus_pseudotime
    ordering_equivalent: true
    numerically_identical: false

existing_core_adoption:
  operation: slingshot_adopt
  can_adopt_complete_external_fit: true
  solves_missing_refit_parameters: only_if_a_complete_source_fit_exists
  archived_complete_fit_found: false
  preserved_scalar_pt_found: true
  suitable_as_primary_solution: false
  core_change_required: false

trajectory_source_policy:
  selected_on: 2026-11-02
  default: fitted_lineage_family
  default_source: authenticated_scwbTrajectory_model_or_lineage_specific_pseudotime_output
  lineage_selection: explicit_lineage_key_or_keys
  scalar_pt_role:
    - fallback_when_fitted_lineage_output_is_unavailable
    - use_when_specifically_requested
    - validation_reference_for_the_published_Bdev_trajectory
  scalar_pt_is_default: false
  preserve_scalar_pt_values_and_missingness: true
  overwrite_scalar_pt: false

proposed_pack_changes:
  owner: scwbTrajectory
  operations:
    - operation: slingshot_fit
      change: Add typed omega and omega_scale parameters and pass them unchanged to slingshot::slingshot.
      defaults: Preserve current behavior when omitted.
    - operation: trajectory_pseudotime_from_cell_vector
      change: Wrap one authenticated continuous cell_vector as a one-key cell_vector_family without changing finite values.
      role: explicit_fallback_adapter_not_default_trajectory_source
      parameters:
        - lineage_key
      outputs:
        - pseudotime
        - adaptation_summary
      semantics:
        - Do not refit a trajectory.
        - Do not orient, rescale, shift, or impute values.
        - Retain the input artifact identity in provenance.
        - Record total, finite, and missing input counts.
        - Represent finite rows in the sparse family while leaving the authoritative scalar vector unchanged.
  new_operation_pack_required: false
  scworkbench_core_change_required: false
  pybench_change_required: false

qualification_contract:
  slingshot_fit:
    - Interface exposes omega and omega_scale with validated types and bounds.
    - Omitted parameters reproduce the current default behavior.
    - The contained model records the requested omega and omega_scale values.
    - A deterministic fixture demonstrates the intended outgroup behavior.
    - Cluster filtering, start cluster, stretch, fitted axis, replay, and atomic promotion tests continue to pass.
  scalar_adapter:
    - Output values and cell identifiers equal the finite input values exactly.
    - Missing-value count and finite-cell universe are reported exactly.
    - The requested lineage key is preserved exactly.
    - The source scalar artifact remains unchanged.
    - A downstream explicit trajectory consumer accepts the output family.
    - Invalid keys, categorical input, empty finite input, and duplicate cells fail without state mutation.
  bdev_validation_after_pack_qualification:
    - Fit on the ATAC UMAP with the published cluster exclusions and Slingshot parameters.
    - Compare negative L4 values with preserved pt on the exact shared finite cell set.
    - Report defined and missing cell identities, lineage membership, numerical differences, and rank correlation.
    - Never overwrite or reinterpret the preserved pt field.

decision:
  result: pack_extension_required
  default_trajectory_source: fitted_lineage_family
  scalar_trajectory_source: fallback_or_explicit_request_only
  next_action: Implement and qualify the two scoped scwbTrajectory changes on a development branch.
  implementation_requires_separate_user_authorization: true
