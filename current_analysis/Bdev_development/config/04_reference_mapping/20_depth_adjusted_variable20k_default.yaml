post_selection_validation:
  run_identity: variance20k_vs_depth_adjusted_20261117T031433Z
  comparator: variance20k
  comparator_definition: Existing scwbrna::hvg_select raw-count variance mode on all Bdev ATAC peaks.
  shared_features: 19174
  features_unique_to_each_axis: 826
  conclusion: >-
    Retain overall20k. Raw variance improved some latent-geometry diagnostics
    but reduced replicate predicted-cluster agreement, increased saturation
    association and reference-hub use, and reduced neighbor-sample entropy.
  default_changed: false
  evidence_document: current_analysis/Bdev_development/docs/04_reference_mapping/14_variance20k_vs_depth_adjusted_comparison.md

official_scwbatac_hvp_validation:
  run_identity: hvp20k_depth_comparison_20261117T044105Z
  adjusted_candidate: hvp_depth20k
  raw_candidate: hvp_raw20k
  conclusion: >-
    Depth-adjusted HVP outperformed raw HVP on most bulk-mapping diagnostics,
    but did not outperform the then-current overall20k default overall. Retain
    overall20k and repair the scwbATAC sparse execution path before acceptance.
  resource_qualification: failed_dense_coercion_2.9_GiB_per_2048_cell_chunk
  default_changed: false
  evidence_document: current_analysis/Bdev_development/docs/04_reference_mapping/15_scwbatac_hvp20k_depth_mode_comparison.md

