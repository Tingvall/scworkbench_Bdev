development_default_policy:
  use_for:
    - frozen-model bulk projection during ongoing Bdev development
    - primary whole-reference Bdev neighborhood and fixed-UMAP mapping
    - first-stage mapping before any conditional trajectory interpretation
  required_sensitivity_model:
    candidate: cluster20k
    purpose: Flag mappings that are unstable to a cluster-discriminating axis with lower peak-saturation association.
    agreement_use: qualitative_and_support_aware_sensitivity_not_coordinate_averaging
  trajectory_policy:
    default_trajectory: authenticated fitted Slingshot L4
    orientation: native
    assignment_stage: second_stage_after_whole_reference_mapping
    current_bulk_output_status: diagnostic_unaccepted
    force_non_l4_queries_onto_trajectory: false
  uncertainty_policy:
    - Retain reference-distance, neighbor diversity, hub use, and replicate coherence diagnostics.
    - Treat discordance with cluster20k as mapping uncertainty rather than averaging the two latent or UMAP coordinates.
    - Retain peak-saturation association as an explicit limitation of overall20k.

boundaries:
  do_not_treat_as:
    - an implementation-stage default
    - a production-qualified model
    - an accepted bulk trajectory assignment model
    - permission to tune or refit with ImmGen identities
    - permission to modify scWorkbench core or an operation pack
  implementation_unlocked: false
  paper_analysis_authorized: false
  selected_frozen_development_artifact_promoted_to_implementation: false
  new_qualified_immutable_sif_still_required: true

