    candidate: overall20k
    purpose: >-
      Preserve the earlier depth-bin variable-peak model as a comparator because
      it had stronger population separation, replicate agreement, support
      distance, and neighbor-sample entropy in the same external benchmark.
    agreement_use: qualitative_and_support_aware_sensitivity_not_coordinate_averaging
  trajectory_policy:
    default_trajectory: authenticated fitted Slingshot L4
    orientation: native
    assignment_stage: second_stage_after_whole_reference_mapping
    current_bulk_output_status: diagnostic_unaccepted
    force_non_l4_queries_onto_trajectory: false
  uncertainty_policy:
    - Retain reference-distance, neighbor diversity, hub use, and replicate coherence diagnostics.
    - Treat discordance with overall20k as feature-selection uncertainty rather than averaging latent or UMAP coordinates.
    - Retain depth and peak-saturation latent associations as explicit limitations.

