schema_version: bdev.development_capability_registry.v1
phase: Bdev_development
status: proposed
numbering_width: 2
identifiers_immutable_after_reference: true
capabilities:
  - capability_id: 01_bulk_marker_boundary
    status: provisional_development_default_selected_no_labels_accepted
    purpose: Qualify reproducible outside-scWorkbench bulk marker discovery and the gene-set import boundary used for ImmGen and related datasets.
    preferred_owner: bdev_outside_preprocessing_plus_scworkbench_gene_set_import
    core_change_indicated: false
    notes: >-
      Replicate-aware bulk analysis remains outside scWorkbench. The production
      workflow and all completed diagnostics remain unchanged. The current
      provisional Bdev development default is the 64-population ImmGen-only
      simple mean-contrast top-20 collection from run
      simple_mean_contrast_20261102T235008Z. It is paired with raw UCell argmax
      reduction, no percentile calibration or broad gate, and a raw margin of
      0.01. It supersedes the earlier complete Parse and 27-target collections
      for working use while preserving them as historical provenance.
      The default covers 61 discovery populations and three held-out-derived
      populations, with replication and fallback evidence labeled explicitly.
      Evidence remains unequal: singleton panels lack replication, two-fold
      evidence is weak, held-out-derived panels do not retain an independent
      validation claim, and full-data refinement is optimistic. A bounded
      1,746-cell Bdev development fixture subsequently confirmed that all 64
      sets import and pass the declared RNA-count overlap gate. The endorsed
      flat 64-way percentile-calibrated reduction assigned only 21 cells at the
      conservative score and margin thresholds; most assignments were non-B
      programs and 1,685 cells abstained for insufficient margin. Therefore the
      64-set collection remained the score and lookup default at that stage,
      but flat winner labels were not accepted. A subsequent unpromoted
      broad-state-first exploration used nine globally contrasted lineage
      panels, retained multiple borderline states, and restricted fine
      competition accordingly. It assigned 357/1,746 cells with the original
      population panels. A comparison that removed 158 genes shared across at
      least three broad lineages assigned fewer cells (332) and changed
      assignment status or label for 310 cells, so that simple filter was not
      selected. The hierarchy is promising exploratory evidence but remains
      insufficient for annotation acceptance. An ImmGen-only global-local
      reconstruction then recovered the correct unthresholded population
      winner for all 126 reference libraries, but only one library cleared the
      frozen flat score and margin gates and zero programs qualified as labels.
      Direct greedy optimization of the actual percentile classifier margin
      also failed: its maximum complete-atlas margin was 0.079365, below the
      0.10 default, and it assigned no libraries. This rules out simple
      shared-gene filtering, raw-score refinement, and direct one-gene
      percentile-margin pruning as compatible repairs for the 64-way flat
      reducer. A final hierarchy test retained the correct broad lineage for
      115/118 held-out libraries. Population-specific margins increased Bdev
      fine-call coverage from 312 to 385 relative to the fixed 0.10 margin,
      with broad-only fallback, but thresholds were estimable for only 32/64
      populations and their apparent precision was optimistic resubstitution
      evidence. A final ImmGen-only population-balanced mean-contrast
      reconstruction was then compared post hoc to the user-supplied sets:
      519/580 supplied genes ranked in the generated top 100 and 224/580 in the
      top 20. With raw UCell and a 0.01 margin it assigned 1416/1746 Bdev cells,
      gave B-heavy calls in sampleIds 3 and 4, and removed the earlier DP/ISP
      failure. The user selected this collection and rule as the provisional
      development default. A 30-round within-population ImmGen bootstrap then
      found 71.2 percent overall cell-round agreement and 57.1 percent stable
      baseline-assigned cells at an 80 percent agreement threshold. Stability
      was strongest for the B-cell manifold and weaker among adjacent stem and
      progenitor labels. The default remains provisional and bootstrap
      agreement should be retained as uncertainty. No artifacts were promoted
      to implementation or scWorkbench core, no labels were accepted as truth,
      and no core or operation-pack change is required.
  - capability_id: 02_slingshot_trajectory_semantics
    status: source_updates_focused_tests_passed_bdev_recreation_complete
    purpose: Qualify exact Slingshot omega behavior and scalar pseudotime-to-lineage adoption semantics.
    preferred_owner: scwbTrajectory
    core_change_indicated: true
    notes: >-
      The 2026-11-02 audit confirmed that scwbtrajectory::slingshot_fit already
      supports the ATAC fit space, cluster filtering, start cluster, stretch,
      contained model, and lineage-family outputs, but it does not expose the
      omega or omega_scale arguments accepted by Slingshot 2.16.0. A separate
      gap exists because the preserved scalar Bdev pt cell_vector cannot be
      wrapped as a lineage-keyed cell_vector_family for explicit trajectory
      consumers. The smallest solution is to extend slingshot_fit with the two
      parameters and add a value-preserving scalar-to-lineage adapter in
      scwbTrajectory. Supporting the typed boolean-or-number omega parameter
      required the explicitly approved generic bool_or_dbl primitive in core.
      Core commit da9477d and scwbTrajectory 0.1.3 commit 080a192 implement the
      changes; the four focused new contracts passed in the baseline SIF.
      The existing core slingshot_adopt operation is unchanged and cannot
      recover a fit that was not retained. PyBench is unchanged. Fitted
      lineage-family pseudotime is the selected default;
      the scalar pt adapter is a fallback for unavailable lineage output or an
      explicitly requested scalar analysis. A full-reference development fit
      then reproduced eight lineages with the published recipe. Negated L4
      shared 12,510 finite cells with preserved pt and gave Spearman 0.999817
      and Pearson 0.999942, but membership and numeric values were not exact
      (941 recreated-only cells, 132 preserved-only cells, mean absolute
      difference 0.5732). Preserved pt and its missingness were unchanged.
      The user accepted this as sufficiently close and selected fitted lineage
      L4 as the default Bdev pseudotime trajectory. New analyses use native L4
      orientation; negated L4 is reserved for explicit legacy-pt alignment.
      The preserved scalar pt remains a validation reference and fallback.
      Outputs remain staged and no paper implementation has been activated.
  - capability_id: 03a_parse_cytokine_signal_generation
    analysis_label: "03a"
    analysis_part: signal_generation
    status: gene_set_reconstruction_complete_signal_scoring_qualification_pending
    purpose: Generate the authenticated cell-level Parse cytokine signal family used by the Bdev trajectory analyses.
    preferred_owner: bdev_outside_preprocessing_plus_scwbGenePrograms
    core_change_indicated: false
    notes: >-
      The archived all-cytokine top-100 competitor-refinement method was
      reconstructed from frozen limma fits, Bdev SCT feature identifiers, and
      the full-precision sample-level capped-rank cache without calling
      scWorkbench. All 52 directions were attempted, 43 candidates were
      constructible, and 38 mean-passing signatures were selected. Candidate
      membership, final membership, and selected-set identity match the
      archived reference exactly. This reconstruction is the gene-set input to
      03a, not the complete signal-generation stage. Completion of 03a still
      requires matrix-bound import of the checksummed 38-set GMT and generation
      of one authenticated UCell cell-vector family on RNA_counts with
      maxRank=1500. The same writable derived analysis bundle is then consumed
      by 03b; no separate bundle is created for each trajectory method.
  - capability_id: 03b_parse_cytokine_trajectory_analysis
    analysis_label: "03b"
    analysis_part: trajectory_analysis
    status: bounded_bdev_development_qualification_passed_sif_pending
    purpose: Qualify descriptive dynamics, permutation-supported intervals, and preranked GSEA for the Parse cytokine programs over fitted Bdev L4 pseudotime.
    preferred_owner: bdev_integration_using_scwbGenePrograms_and_scwbTrajectory
    core_change_indicated: false
    notes: >-
      Published scwbTrajectory 0.1.5 commit
      34c792d39a7a9950294bf3e29e1cb65ebf1aba6c provides the existing
      scwbtrajectory::trajectory_signal_dynamics_explicit operation, the
      canonical scwbtrajectory::trajectory_signal_intervals replacement for
      the deprecated trajectory_signal_regions name, and the new
      scwbtrajectory::trajectory_preranked_gsea operation. Its operation-pack
      manifest has SHA-256
      576156623f04d8d34f07062eb17a1612ce1e4d20926516afbc06a74af141c8f9.
      Run bdev_cytokine_trajectory_20261105T153001Z passed all 12 focused
      contracts and completed all three methods on a deterministic 1810-cell
      fixture from authenticated native Slingshot L4. All 38 sets passed both
      RNA_counts and SCT_data overlap checks. The common scale was 20 dynamics
      bins, interval width 0.05/step 0.025, and local GSEA width 0.05/step
      0.025. Both inferential methods used unblocked permutations; orig.ident
      was reporting/audit metadata only. The archived bundle and preserved pt
      were unchanged, and no outputs were promoted. The run and its focused
      FLT3L-up and IL-7-up four-view figures are retained as the preliminary
      analysis for later implementation. The presentation convention is LSK
      (0) to CD19 (1), implemented only as one minus the native L4 fraction;
      native fitted L4 remains the analysis trajectory. A new immutable SIF
      must still be built, qualified, checksummed, and explicitly accepted
      before implementation or paper analysis is activated, at which point
      the frozen analysis must be rerun rather than promoting these development
      outputs.
  - capability_id: 04_reference_mapping
    status: deferred_until_relevant_analysis_is_approved
    purpose: Qualify reference fitting, projection, support calibration, pseudotime transfer, uncertainty, and out-of-reference calls.
    preferred_owner: scwbRepresentation_scwbLatent_or_new_scwbReferenceMap
    core_change_indicated: false
  - capability_id: 05_trajectory_group_contrasts
    status: deferred_until_relevant_analysis_is_approved
    purpose: Qualify support-aware occupancy, signal, and motif contrasts between biological groups.
    preferred_owner: scwbTrajectory_or_new_official_contrast_pack
    core_change_indicated: false
