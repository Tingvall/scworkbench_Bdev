schema_version: bdev.dataset_registry.v1
status: proposed
phase: reserved_for_future_implementation
active: false
numbering_width: 2
identifiers_immutable_after_reference: true
datasets:
  - dataset_id: 01_bdev_reference
    role: immutable_source
    status: proposed
    description: Bdev assays, reductions, metadata, and preserved pt values.
  - dataset_id: 02_immgen_bulk_rna
    role: immutable_source
    status: proposed
    description: ImmGen bulk counts, normalized values, sample design, and marker provenance.
  - dataset_id: 03_bulk_atac_reference
    role: immutable_source
    status: proposed
    description: Selected bulk ATAC libraries, metadata, genome build, and peak mapping.
  - dataset_id: 04_parse_cytokines
    role: immutable_source
    status: proposed
    description: Reprocessed Parse cytokine source and QC state.
  - dataset_id: 05_scmulti_flt3lko_il7ko
    role: immutable_source
    status: proposed_identity_confirmed_implementation_locked
    description: Single-cell multiome query source containing Flt3l ligand knockout (FLT3LKO), Il7 knockout (IL7KO), and the corresponding WT libraries.
    known_design_limitations:
      biological_sample_field: absent
      libraries_per_target_genotype: 1
      inferential_genotype_testing: requires_independent_biological_replication_provenance
  - dataset_id: 06_bdev_annotation_trajectory
    role: derived
    status: proposed
    parents:
      - 01_bdev_reference
      - 02_immgen_bulk_rna
      - 04_parse_cytokines
    description: Bdev annotation using the proposed ImmGen mean-contrast top-20/raw-UCell margin-0.01 strategy, uncertainty fields, trajectory comparison, and approved gene-set results.
    proposed_labeling_strategy_record: ../docs/proposed_analysis_strategy.md
  - dataset_id: 07_bdev_atac_mapping
    role: derived
    status: proposed_method_selected_implementation_locked
    parents:
      - 01_bdev_reference
      - 03_bulk_atac_reference
      - 05_scmulti_flt3lko_il7ko
    proposed_reference_mapping_default: reference_mapping.yaml
    proposed_method: gated_20d_shared_reference_mapping
    description: Reference and query projections, mapping QC, pseudotime transfer, chromVAR, and motif contrasts.
